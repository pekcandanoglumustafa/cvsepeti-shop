<!-- Kurumsal logo — layout.tsx'teki Organization şemasına bağlı; Google
     arama sonuçlarında ve bilgi panelinde bu görsel çıkıyor.
     Başlıktaki işaretin ve marka yazısının aynısı. Eski sürüm ince çizgili
     koniyi ve artık kullanılmayan #FF3B00 turuncusunu taşıyordu, yani
     aramada görünen logo sitedekinden başkaydı.
     Yazı burada gömülü font olmadan çizilmek zorunda (Google webfont
     yüklemez), bu yüzden ağır bir sistem sans yığını kullanılıyor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="300" height="60">
  <rect width="300" height="60" fill="#FFFFFF"/>
  <g transform="translate(14,11)">
    <path d="M13 3h10l4 10H9zM7 17h22l4 10H3zM1 31h34v5H1z" fill="#E95325"/>
  </g>
  <text x="60" y="39"
        font-family="Manrope, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="27" letter-spacing="-1.4" fill="#1D2A30">trafik<tspan
        font-weight="500">urunleri</tspan><tspan font-size="13" font-weight="500">.com</tspan></text>
</svg>
